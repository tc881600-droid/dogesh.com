<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dogesh.com — Every Dog Breed, Loud & Proud</title>
<meta name="description" content="Dogesh.com — the loudest archive of good dogs on the internet. 170+ breeds, hard shadows, zero blur." />

<!-- Type: Space Grotesk (400/500/700/900) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=block" rel="stylesheet" />

<!-- Tailwind CDN -->
<link rel="stylesheet" href="/css/styles.css" />
<style>
  :root { color-scheme: light; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Space Grotesk', sans-serif; }
  ::selection { background: #FFD93D; color: #000; }

  /* Hollow display type */
  .text-hollow { color: transparent; -webkit-text-stroke: 2px #000; }
  @media (min-width: 768px) { .text-hollow { -webkit-text-stroke: 3px #000; } }
  .text-hollow-white { color: transparent; -webkit-text-stroke: 2px #fff; }
  @supports not (-webkit-text-stroke: 1px black) {
    .text-hollow { color: #000; }
    .text-hollow-white { color: #fff; }
  }

  /* Textures */
  .bg-halftone { background-image: radial-gradient(#000 1.5px, transparent 1.5px); background-size: 20px 20px; }
  .bg-halftone-white { background-image: radial-gradient(rgba(255,255,255,.35) 1.5px, transparent 1.5px); background-size: 20px 20px; }
  .bg-gridpaper {
    background-image: linear-gradient(to right, rgba(0,0,0,.08) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(0,0,0,.08) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .bg-noise {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Marquee */
  @keyframes marquee { to { transform: translateX(-50%); } }
  .marquee-track { display: flex; width: max-content; animation: marquee 22s linear infinite; }
  .marquee-track.reverse { animation-direction: reverse; }

  /* Slow spin for stars */
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .animate-spin-slow { animation: spin-slow 10s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .marquee-track, .animate-spin-slow, .animate-bounce, .animate-pulse { animation: none !important; }
    * { transition-duration: 1ms !important; }
  }
</style>
